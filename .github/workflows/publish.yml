name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - name: Skip versions already on npm
        id: published
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version --prefer-online >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists != 'true'
        run: npm install -g npm@latest
      - if: steps.published.outputs.exists != 'true'
        run: npm ci
      - if: steps.published.outputs.exists != 'true'
        run: npm run check
      - if: steps.published.outputs.exists != 'true'
        run: npm test
      - if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public
